name: Build Android app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: npm install
      - name: Prepare web app
        env:
          ROWSKAN_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node prepare.js
      - name: Create the Android project
        run: |
          npx cap add android
          node patch-native.js android
      - name: Icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#f59e0b' --iconBackgroundColorDark '#f59e0b'
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rowskan-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
